<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed Job Processing Platform</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1b2330;--muted:#66717f;--line:#e2e6ec;--soft:#eef1f6;--accent:#2f5fd0;--accent-ink:#fff;
--ok:#18864b;--okbg:#e3f5ea;--bad:#c93a3a;--badbg:#fbe7e7;--warn:#a86a00;--warnbg:#fdf1d8;--info:#2f5fd0;--infobg:#e6edfc;
--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1319;--panel:#181e27;--ink:#e8ecf2;--muted:#93a0b3;--line:#2a323f;--soft:#202733;--accent:#6f95f0;--accent-ink:#0b1220;
--ok:#4cc784;--okbg:#14301f;--bad:#f27b7b;--badbg:#3a1b1b;--warn:#e8b24d;--warnbg:#38290c;--info:#8aa8f5;--infobg:#1c2a4a;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--accent);text-decoration:none}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:15px;line-height:1.3;padding:0 10px 14px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:4px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink);font-weight:500}
nav a:hover{background:var(--soft)}
nav a.active{background:var(--infobg);color:var(--accent)}
.side-note{margin-top:auto;padding:10px;font-size:12px;color:var(--muted)}
main{padding:28px 32px 60px;max-width:1080px;width:100%}
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-size:24px;line-height:1.25}
.head p{margin:4px 0 0;color:var(--muted);max-width:620px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:16px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;margin-right:8px}
.btn{display:inline-flex;gap:8px;align-items:center;font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=text],input[type=number],input[type=search],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:0}
input[type=text]{width:100%;max-width:440px}
input.err{border-color:var(--bad)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.pill.muted{background:var(--soft);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--soft);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:22px;line-height:1.2}.tile span{font-size:12px;color:var(--muted)}
.bar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;margin:12px 0}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .25s}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.trunc{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;background:var(--soft)}
.drop.over{border-color:var(--accent);background:var(--infobg)}
.drop p{margin:6px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.proj{display:flex;flex-direction:column;gap:6px}
.proj h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.flow div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px}
.flow div b{display:block;font-size:14px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px;margin:10px 0}
.checks label{display:flex;gap:8px;align-items:center}
.note{background:var(--infobg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warnbg)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:40px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:var(--r);padding:22px;max-width:520px;width:100%;max-height:88vh;overflow:auto;border:1px solid var(--line)}
.modal h3{margin:0 0 8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:12px 0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;max-width:360px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:14px}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
details.cols summary{cursor:pointer;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 14px;border-radius:9px;background:var(--panel);font-weight:500}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
 .brand{padding:0 8px 0 0;flex:1 1 100%}.side-note{display:none}
 nav{display:flex;gap:2px;overflow-x:auto;width:100%}nav a{white-space:nowrap;padding:8px}
 main{padding:18px 16px 50px}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Distributed Job Processing Platform<small>Upload documents, extract the key details automatically, and download the results.</small></div>
    <nav id="nav"></nav>
    <div class="side-note">Projects are remembered in this browser only. Documents and results are stored on the server.</div>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================== helpers ============================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICONS = {
  home: "M3 11l9-8 9 8M5 10v10h14V10", folder: "M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
  plus: "M12 5v14M5 12h14", upload: "M12 16V4M6 10l6-6 6 6M4 20h16", file: "M6 3h8l4 4v14H6zM14 3v4h4",
  list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01", table: "M3 5h18v14H3zM3 10h18M9 5v14",
  flask: "M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3", download: "M12 4v12M6 12l6 6 6-6M4 20h16",
  trash: "M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13", check: "M5 12l5 5 9-10", x: "M6 6l12 12M18 6L6 18",
  save: "M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7", play: "M7 4l13 8-13 8z", edit: "M4 20h4L19 9l-4-4L4 16z", alert: "M12 4l10 17H2zM12 10v5M12 18h.01"
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
const fmtNum = n => Number(n || 0).toLocaleString();
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); };
const fmtSize = b => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(1) + " MB";
const fmtDur = s => { s = Math.round(s); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s"; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "results";

const store = {
  get(k, d) { try { const v = localStorage.getItem("jpp." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jpp." + k, JSON.stringify(v)); return true; } catch { return false; } }
};

function detailMsg(d) {
  if (!d || d.detail === undefined) return "";
  if (typeof d.detail === "string") return d.detail;
  try { return d.detail.map(x => x.msg).join("; "); } catch { return "Invalid request"; }
}
async function api(path, opts) {
  let r;
  try { r = await fetch(path, opts); } catch { throw new Error("Can't reach the server. Check that the platform is running."); }
  if (!r.ok) { let d; try { d = await r.json(); } catch { } const e = new Error(detailMsg(d) || "Request failed (" + r.status + ")"); e.status = r.status; throw e; }
  return r.json();
}
function toast(msg, kind = "") {
  const t = document.createElement("div"); t.className = "toast " + kind; t.textContent = msg;
  $("#toasts").appendChild(t); setTimeout(() => t.remove(), 5000);
}
function modal(html) {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => { o.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  o.addEventListener("mousedown", e => { if (e.target === o) close(); });
  document.body.appendChild(o);
  return { el: o, close };
}
function confirmBox(title, msg, okLabel = "Confirm", danger = true) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3><p class="muted">${esc(msg)}</p><div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" data-no>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" data-ok>${esc(okLabel)}</button></div>`);
    m.el.querySelector("[data-no]").onclick = () => { m.close(); res(false); };
    m.el.querySelector("[data-ok]").onclick = () => { m.close(); res(true); };
    m.el.querySelector("[data-no]").focus();
  });
}
function promptBox(title, value) {
  return new Promise(res => {
    const m = modal(`<h3>${esc(title)}</h3><input type="text" maxlength="120" value="${esc(value)}"><div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" data-no>Cancel</button><button class="btn primary" data-ok>Save</button></div>`);
    const inp = m.el.querySelector("input"); inp.focus(); inp.select();
    const done = v => { m.close(); res(v); };
    m.el.querySelector("[data-no]").onclick = () => done(null);
    m.el.querySelector("[data-ok]").onclick = () => done(inp.value.trim() || null);
    inp.onkeydown = e => { if (e.key === "Enter") done(inp.value.trim() || null); };
  });
}
const head = (title, sub, actions = "") => `<div class="head"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ""}</div><div class="row">${actions}</div></div>`;
const loading = () => `<div class="loading"><span class="spin"></span><div>Loading…</div></div>`;
const emptyBox = (title, text, action = "") => `<div class="card empty"><h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;
const pill = (label, kind) => `<span class="pill ${kind}">${esc(label)}</span>`;

/* ============================== domain ============================== */
// The backend extracts all of these from every document; the UI only chooses what to show/export.
const COLS = [["filename", "File"], ["invoice_number", "Invoice number"], ["invoice_date", "Invoice date"], ["due_date", "Due date"],
["vendor", "Vendor"], ["total", "Total"], ["currency", "Currency"], ["confidence", "Confidence"]];
const OPTIONAL = COLS.filter(c => c[0] !== "filename");
const colLabel = k => (COLS.find(c => c[0] === k) || [k, k])[1];
const loadCols = () => { const s = store.get("cols", null); return Array.isArray(s) ? s.filter(k => OPTIONAL.some(c => c[0] === k)) : OPTIONAL.map(c => c[0]); };
const JOB = { PENDING: ["Queued", "muted"], PROCESSING: ["Processing", "info"], RETRYING: ["Retrying", "warn"], COMPLETED: ["Completed", "ok"], FAILED: ["Failed", "bad"] };
const jobPill = s => pill(...(JOB[s] || [s, "muted"]));
function batchState(b) {
  if (b.status !== "DONE") return ["Processing", "info"];
  if (b.failed_count === 0) return ["Completed", "ok"];
  if (b.completed_count === 0) return ["Failed", "bad"];
  return ["Partially completed", "warn"];
}
const batchPill = b => pill(...batchState(b));

let projects = store.get("projects", []);
const saveProjects = () => { if (!store.set("projects", projects)) toast("Couldn't save projects in this browser (storage unavailable).", "bad"); };
const projectOf = id => projects.find(p => p.batchIds.includes(id));
const batchTitle = b => { const p = projectOf(b.id); return p ? p.name : b.name; };

async function batchMap(ids) {
  const list = await api("/api/batches?limit=100").catch(() => []);
  const m = new Map(list.map(b => [b.id, b]));
  await Promise.all(ids.filter(i => !m.has(i)).map(async i => { try { m.set(i, await api("/api/batches/" + i)); } catch { } }));
  return m;
}

/* ---- results data, CSV / JSON export ---- */
const flat = r => ({ filename: r.filename, ...r.fields, confidence: r.confidence });
async function fetchAllResults(id) {
  const all = [];
  for (let off = 0; off < 50000; off += 5000) {
    const rows = await api(`/api/batches/${id}/results?limit=5000&offset=${off}`);
    all.push(...rows.map(flat)); if (rows.length < 5000) break;
  }
  return all;
}
function csvCell(v) {
  if (v === null || v === undefined) return "";
  let s = String(v);
  if (typeof v === "string" && /^[=+\-@\t\r]/.test(s)) s = "'" + s; // stop spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const toCSV = (rows, keys) => "﻿" + [keys.map(colLabel).join(",")].concat(rows.map(r => keys.map(k => csvCell(r[k])).join(","))).join("\r\n");
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const selectedKeys = () => ["filename", ...loadCols()];
async function downloadBatch(b, fmt) {
  try {
    const rows = await fetchAllResults(b.id);
    if (!rows.length) return toast("There are no results to download yet.", "bad");
    const keys = selectedKeys(), base = slug(batchTitle(b)) + "-results";
    if (fmt === "json") download(base + ".json", JSON.stringify(rows.map(r => Object.fromEntries(keys.map(k => [k, r[k]]))), null, 2), "application/json");
    else download(base + ".csv", toCSV(rows, keys), "text/csv;charset=utf-8");
    toast(`Downloaded ${fmtNum(rows.length)} results.`, "ok");
  } catch (e) { toast(e.message, "bad"); }
}

/* ============================== router ============================== */
const view = $("#view");
const NAV = [["", "Dashboard", "home"], ["projects", "My Projects", "folder"], ["new", "Create New Project", "plus"],
["jobs", "My Jobs", "list"], ["results", "Results", "table"], ["demo", "Demo & Testing", "flask"]];
$("#nav").innerHTML = NAV.map(([p, l, i]) => `<a href="#/${p}" data-p="${p}">${ic(i)}${l}</a>`).join("");
let cleanup = null, token = 0;

async function route() {
  if (cleanup) { try { cleanup(); } catch { } cleanup = null; }
  const my = ++token, alive = () => my === token;
  const [page = "", a, b] = (location.hash || "#/").slice(2).split("/");
  const navKey = { project: "projects", batch: "jobs" }[page] ?? page;
  document.querySelectorAll("#nav a").forEach(x => x.classList.toggle("active", x.dataset.p === navKey));
  window.scrollTo(0, 0);
  view.innerHTML = loading();
  try {
    if (page === "projects") await viewProjects(alive);
    else if (page === "project") await viewProject(a, alive);
    else if (page === "new") await viewNew(a, alive);
    else if (page === "jobs") await viewJobs(alive);
    else if (page === "batch") await viewBatch(a, alive);
    else if (page === "results") await viewResults(a, alive);
    else if (page === "demo") await viewDemo(alive);
    else await viewDashboard(alive);
  } catch (e) {
    if (!alive()) return;
    view.innerHTML = `<div class="card empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p><button class="btn" id="retry">Try again</button></div>`;
    $("#retry").onclick = route;
  }
}
window.addEventListener("hashchange", route);

/* ============================== Dashboard ============================== */
async function viewDashboard(alive) {
  const batches = await api("/api/batches?limit=100");
  if (!alive()) return;
  const docs = batches.reduce((s, b) => s + b.total_docs, 0), ok = batches.reduce((s, b) => s + b.completed_count, 0), bad = batches.reduce((s, b) => s + b.failed_count, 0);
  const recent = [...projects].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 4);
  view.innerHTML = head("Dashboard", "Upload your documents, let the platform read them, then review and download the results.",
    `<a class="btn primary" href="#/new">${ic("plus")}Create New Project</a>`) + `
  <div class="card"><h2>How it works</h2><p class="hint">Five simple steps, no technical knowledge needed.</p>
    <div class="flow"><div><b>1. Create a project</b>Give your work a name</div><div><b>2. Upload files</b>.txt or .pdf invoices</div>
    <div><b>3. Choose fields</b>Pick what to show</div><div><b>4. Start processing</b>The platform does the rest</div><div><b>5. Review &amp; download</b>Check results, save as CSV</div></div></div>
  <div class="tiles" style="margin-bottom:18px">
    <div class="tile"><b>${fmtNum(projects.length)}</b><span>Projects in this browser</span></div>
    <div class="tile"><b>${fmtNum(batches.length)}</b><span>Jobs (latest 100)</span></div>
    <div class="tile"><b>${fmtNum(ok)}</b><span>Files completed</span></div>
    <div class="tile"><b>${fmtNum(bad)}</b><span>Files failed</span></div>
    <div class="tile"><b>${fmtNum(docs)}</b><span>Files submitted</span></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Recent projects</h2><a href="#/projects">View all</a></div>
    ${recent.length ? `<div class="grid" style="margin-top:12px">${recent.map(projCard).join("")}</div>` : emptyBox("No projects yet", "Create your first project to start processing documents.", `<a class="btn primary" href="#/new">${ic("plus")}Create New Project</a>`)}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Recent activity</h2><a href="#/jobs">View all jobs</a></div>
    ${batches.length ? jobsTable(batches.slice(0, 6)) : emptyBox("No activity yet", "Jobs appear here once you start processing.")}</div>`;
}
function projCard(p, m) {
  const last = m && m.get(p.batchIds[p.batchIds.length - 1]);
  const st = !p.batchIds.length ? pill("Draft", "muted") : last ? batchPill(last) : pill("Unknown", "muted");
  return `<div class="card proj" style="margin:0"><h3>${esc(p.name)}</h3><div class="muted" style="font-size:13px">Last modified ${fmtDate(p.updatedAt)}</div>

/* ============================== Create project / upload ============================== */
const MAX_BYTES = 5 * 1024 * 1024;
function uploadFiles(files, onProg) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open("POST", "/api/batches/upload");
    x.upload.onprogress = e => { if (e.lengthComputable) onProg(e.loaded / e.total); };
    x.onload = () => { let d; try { d = JSON.parse(x.responseText); } catch { } (x.status >= 200 && x.status < 300 && d) ? res(d) : rej(new Error(detailMsg(d) || "Upload failed (" + x.status + ")")); };
    x.onerror = () => rej(new Error("Can't reach the server. Check that the platform is running."));
    const fd = new FormData(); files.forEach(f => fd.append("files", f, f.name)); x.send(fd);
  });
}
function colChecks(sel) {
  return `<div class="checks">${OPTIONAL.map(([k, l]) => `<label><input type="checkbox" data-col="${k}" ${sel.has(k) ? "checked" : ""}> ${esc(l)}</label>`).join("")}</div>`;
}
async function viewNew(pid, alive) {
  const proj = pid ? projects.find(p => p.id === pid) : null;
  if (pid && !proj) { view.innerHTML = head("Project not found") + emptyBox("This project isn't in this browser", "", `<a class="btn" href="#/new">Create a new project</a>`); return; }
  const draft = proj ? {} : store.get("draft", {});
  let files = [], seq = 0, busy = false, name = proj ? proj.name : (draft.name || "");
  const sel = new Set(Array.isArray(draft.cols) ? draft.cols : loadCols());

  view.innerHTML = head(proj ? "Upload more files" : "Create New Project", proj ? "These files will be added to “" + proj.name + "” as a new job." : "Name your project, add your documents, then start processing.") + `
  <div class="card"><h2><span class="step">1</span>Project name</h2><p class="hint">For example: “Supplier invoices – November 2026”.</p>
    <input type="text" id="pname" maxlength="120" placeholder="Project name" value="${esc(name)}" ${proj ? "readonly" : ""}><div id="nerr" class="muted" style="color:var(--bad);font-size:13px;margin-top:4px"></div></div>
  <div class="card"><h2><span class="step">2</span>Upload files</h2><p class="hint">Supported formats: <b>.txt</b> and <b>.pdf</b> (text-based invoices), up to 5 MB each.</p>
    <div class="drop" id="drop">${ic("upload")}<p><b>Drag and drop files here</b></p><p class="muted">or</p>
      <button class="btn primary" id="browse">${ic("file")}Browse Files</button><input type="file" id="picker" multiple accept=".txt,.pdf,text/plain,application/pdf" hidden></div>
    <div id="flist" style="margin-top:14px"></div></div>
  <div class="card"><h2><span class="step">3</span>What would you like to see in your results?</h2>
    <p class="hint">The platform reads all of these details from every document automatically. Choose which ones appear in your results table and downloads.</p>
    <div class="row"><button class="btn sm" id="colAll">Select All</button><button class="btn sm" id="colNone">Deselect All</button></div>
    <div id="cols">${colChecks(sel)}</div>
    <div class="note">Custom fields aren't supported yet. Only the details listed above can be extracted.</div></div>
  <div class="card"><h2><span class="step">4</span>Start</h2><div id="summary" class="hint"></div>
    <div id="prog" class="bar" hidden><div></div></div>
    <div class="row"><button class="btn primary" id="start">${ic("play")}Start Processing</button>
    ${proj ? "" : `<button class="btn" id="save">${ic("save")}Save Progress</button>`}</div>
    ${proj ? "" : `<p class="hint" style="margin:10px 0 0">Save Progress remembers the project name and chosen fields in this browser. Files can't be saved, so you'll need to add them again.</p>`}</div>`;

  const fl = $("#flist"), nameEl = $("#pname");
  function drawFiles() {
    const total = files.reduce((s, f) => s + f.file.size, 0);
    $("#summary").textContent = files.length ? `${files.length} file${files.length === 1 ? "" : "s"} ready · ${fmtSize(total)}` : "No files added yet.";
    $("#start").disabled = busy || !files.length;
    if (!files.length) { fl.innerHTML = ""; return; }
    fl.innerHTML = `<div class="row" style="margin-bottom:8px"><button class="btn sm" id="selAll">Select All</button><button class="btn sm" id="clrSel">Clear Selection</button>
      <button class="btn sm danger" id="rmSel" ${files.some(f => f.sel) ? "" : "disabled"}>${ic("trash")}Remove Selected</button></div>
      <div class="table-wrap"><table><thead><tr><th></th><th>Name</th><th>Format</th><th>Size</th><th>Status</th></tr></thead><tbody>
      ${files.map(f => `<tr><td><input type="checkbox" data-fid="${f.id}" ${f.sel ? "checked" : ""} ${busy ? "disabled" : ""} aria-label="Select ${esc(f.file.name)}"></td><td class="trunc">${esc(f.file.name)}</td>
       <td>${esc(f.file.name.split(".").pop().toUpperCase())}</td><td>${fmtSize(f.file.size)}</td><td>${pill(f.status, f.status === "Ready" ? "ok" : f.status === "Failed" ? "bad" : "info")}</td></tr>`).join("")}</tbody></table></div>`;
  }
  function addFiles(list) {
    let skipped = 0;
    for (const file of list) {
      if (!/\.(txt|pdf)$/i.test(file.name) || file.size > MAX_BYTES || file.size === 0) { skipped++; continue; }
      if (files.some(f => f.file.name === file.name && f.file.size === file.size && f.file.lastModified === file.lastModified)) continue;
      files.push({ id: ++seq, file, sel: false, status: "Ready" });
    }
    if (skipped) toast(`${skipped} file${skipped === 1 ? " was" : "s were"} skipped: only non-empty .txt and .pdf files up to 5 MB are supported.`, "bad");
    drawFiles();
  }

  $("#picker").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
  const drop = $("#drop");
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); if (!busy) addFiles([...e.dataTransfer.files]); });
  fl.addEventListener("click", e => {
    const t = e.target.closest("button,input"); if (!t || busy) return;
    if (t.dataset.fid) { const f = files.find(x => x.id === +t.dataset.fid); if (f) f.sel = t.checked; drawFiles(); }
    else if (t.id === "selAll") { files.forEach(f => f.sel = true); drawFiles(); }
    else if (t.id === "clrSel") { files.forEach(f => f.sel = false); drawFiles(); }
    else if (t.id === "rmSel") { files = files.filter(f => !f.sel); drawFiles(); }
  });
  $("#cols").addEventListener("change", e => { const k = e.target.dataset.col; if (k) e.target.checked ? sel.add(k) : sel.delete(k); });
  const setAll = on => { on ? OPTIONAL.forEach(c => sel.add(c[0])) : sel.clear(); $("#cols").innerHTML = colChecks(sel); };
  $("#colAll").onclick = () => setAll(true); $("#colNone").onclick = () => setAll(false);
  const saveBtn = $("#save");
  if (saveBtn) saveBtn.onclick = () => {
    if (store.set("draft", { name: nameEl.value.trim(), cols: [...sel] })) toast("Progress saved in this browser. Add your files again when you return.", "ok");
    else toast("Couldn't save: browser storage is unavailable.", "bad");
  };
  $("#start").onclick = async () => {
    name = nameEl.value.trim();
    if (!name) { nameEl.classList.add("err"); $("#nerr").textContent = "Please give your project a name."; nameEl.focus(); return; }
    nameEl.classList.remove("err"); $("#nerr").textContent = "";
    if (!files.length) return;
    busy = true; files.forEach(f => f.status = "Uploading…"); drawFiles();
    const bar = $("#prog"); bar.hidden = false;
    try {
      const b = await uploadFiles(files.map(f => f.file), p => { bar.firstElementChild.style.width = Math.round(p * 100) + "%"; });
      store.set("cols", [...sel]); store.set("draft", {});
      const now = Date.now();
      if (proj) { proj.batchIds.push(b.id); proj.updatedAt = now; }
      else projects.push({ id: "p" + now.toString(36) + Math.random().toString(36).slice(2, 6), name, createdAt: now, updatedAt: now, batchIds: [b.id] });
      saveProjects(); location.hash = "#/batch/" + b.id;
    } catch (e) { busy = false; files.forEach(f => f.status = "Failed"); drawFiles(); bar.hidden = true; toast(e.message, "bad"); files.forEach(f => f.status = "Ready"); drawFiles(); }
  };
  drawFiles();
}

/* ============================== Monitor a batch ============================== */
async function viewBatch(id, alive) {
  let b = await api("/api/batches/" + id); if (!alive()) return;
  const TABS = [["ALL", "All"], ["PENDING", "Queued"], ["PROCESSING", "Processing"], ["RETRYING", "Retrying"], ["COMPLETED", "Completed"], ["FAILED", "Failed"]];
  let counts = null, tab = "ALL", off = 0, done = b.status === "DONE", closed = false, ws = null, iv = null, last = null, wsTimer = null;
  const t0 = Date.now(), fin0 = b.completed_count + b.failed_count, PAGE = 100;
  const proj = projectOf(id);

  view.innerHTML = head(batchTitle(b), "Started " + fmtDate(b.created_at) + (proj ? "" : " · not part of a project"), `<a class="btn" href="#/jobs">All jobs</a>`) + `
  <div class="card"><div class="row" style="justify-content:space-between"><div id="state"></div><b id="pct" style="font-size:20px"></b></div>
    <div class="bar" role="progressbar" aria-label="Overall progress"><div id="fill"></div></div>
    <div class="tiles" id="tiles"></div><p class="muted" id="speed" style="margin:12px 0 0;font-size:13px"></p>
    <div class="row" id="acts" style="margin-top:14px" hidden>
      <a class="btn primary" href="#/results/${esc(id)}">${ic("table")}View Results</a>
      <button class="btn" id="dl">${ic("download")}Download Results</button>
      <button class="btn" id="vf" hidden>${ic("alert")}View Failed Files</button></div></div>
  <div class="card"><h2>Processing activity</h2><p class="hint">The status of each file in this job.</p><div class="tabs" id="tabs"></div>
    <div id="jobs">${loading()}</div><div class="row" id="pager" style="justify-content:space-between;margin-top:10px"></div>
    <div id="fnote" class="note warn" hidden style="margin-top:12px">Retrying failed files isn't available yet. Fix the file if needed and upload it again as a new job.</div></div>`;

  function paint(p) {
    last = p; const fin = p.completed + p.failed, pct = p.total ? Math.floor(100 * fin / p.total) : 0, isDone = p.status === "DONE";
    $("#fill").style.width = (isDone ? 100 : pct) + "%"; $("#pct").textContent = (isDone ? 100 : pct) + "%";
    $("#state").innerHTML = batchPill({ status: p.status, failed_count: p.failed, completed_count: p.completed });
    const c = counts, n = k => c ? fmtNum(c[k] || 0) : "—";
    const waiting = c ? fmtNum((c.PENDING || 0) + (c.RETRYING || 0)) : "—";
    $("#tiles").innerHTML = `<div class="tile"><b>${fmtNum(p.total)}</b><span>Files submitted</span></div><div class="tile"><b>${waiting}</b><span>Waiting${c && c.RETRYING ? " (incl. retries)" : ""}</span></div>
      <div class="tile"><b>${n("PROCESSING")}</b><span>Processing now</span></div><div class="tile"><b>${fmtNum(p.completed)}</b><span>Completed</span></div><div class="tile"><b>${fmtNum(p.failed)}</b><span>Failed</span></div>`;
    let sp = "";
    if (isDone) { const s = (new Date(b.completed_at) - new Date(b.created_at)) / 1000; if (s > 0) sp = `Finished in ${fmtDur(s)} · about ${(p.total / s).toFixed(1)} files per second.`; }
    else { const el = (Date.now() - t0) / 1000, got = fin - fin0, rate = el > 2 ? got / el : 0;
      if (rate > 0) { sp = `Speed: about ${rate.toFixed(1)} files per second.`; if (got >= 25 && el >= 5) sp += ` Estimated time left: ${fmtDur((p.total - fin) / rate)} (an estimate).`; } else sp = "Waiting for the first results…"; }
    $("#speed").textContent = sp;
    $("#acts").hidden = !isDone; $("#vf").hidden = !(isDone && p.failed);
    $("#fnote").hidden = !p.failed;
  }
  function drawTabs() {
    $("#tabs").innerHTML = TABS.filter(([k]) => k !== "RETRYING" || (counts && counts.RETRYING) || tab === k).map(([k, l]) =>
      `<button class="tab ${tab === k ? "on" : ""}" data-t="${k}">${l}${counts ? " (" + fmtNum(k === "ALL" ? b.total_docs : counts[k] || 0) + ")" : ""}</button>`).join("");
  }
  async function loadJobs() {
    const q = new URLSearchParams({ limit: PAGE, offset: off }); if (tab !== "ALL") q.set("status", tab);
    const rows = await api(`/api/batches/${id}/jobs?${q}`); if (!alive()) return;
    const tot = tab === "ALL" ? b.total_docs : (counts && counts[tab]) || 0;
    $("#jobs").innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr><th>File</th><th>Status</th><th>Tries</th><th>Details</th></tr></thead><tbody>
      ${rows.map(j => `<tr><td class="trunc">${esc(j.filename)}</td><td>${jobPill(j.status)}</td><td>${j.attempts}</td><td class="trunc muted">${esc(j.error || "")}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty">No files with this status.</div>`;
    $("#pager").innerHTML = `<span class="muted">${rows.length ? `Showing ${off + 1}–${off + rows.length} of ${fmtNum(tot)}` : ""}</span>
      <span class="row"><button class="btn sm" data-pg="-1" ${off === 0 ? "disabled" : ""}>Previous</button><button class="btn sm" data-pg="1" ${off + PAGE >= tot ? "disabled" : ""}>Next</button></span>`;
  }
  async function tick() {
    try { counts = await api(`/api/batches/${id}/status-counts`); if (!alive()) return; drawTabs(); if (last) paint(last); await loadJobs(); } catch { }
  }
  async function onDone() {
    if (done && b.status === "DONE") return;
    done = true; clearInterval(iv);
    try { b = await api("/api/batches/" + id); } catch { }
    if (!alive()) return; paint({ total: b.total_docs, completed: b.completed_count, failed: b.failed_count, status: "DONE" }); await tick();
    toast("Processing finished.", "ok");
  }
  function connect() {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/batches/" + id);
    ws.onmessage = e => { let p; try { p = JSON.parse(e.data); } catch { return; } paint(p); if (p.status === "DONE" && !done) onDone(); };
    ws.onclose = () => { if (!closed && !done) wsTimer = setTimeout(connect, 2000); };
  }
  $("#tabs").onclick = e => { const t = e.target.closest("[data-t]"); if (t) { tab = t.dataset.t; off = 0; drawTabs(); loadJobs().catch(() => { }); } };
  $("#pager").onclick = e => { const t = e.target.closest("[data-pg]"); if (t) { off = Math.max(0, off + PAGE * +t.dataset.pg); loadJobs().catch(() => { }); } };
  $("#dl").onclick = () => downloadBatch(b, "csv");
  $("#vf").onclick = () => { tab = "FAILED"; off = 0; drawTabs(); loadJobs().catch(() => { }); $("#jobs").scrollIntoView({ behavior: "smooth" }); };

  cleanup = () => { closed = true; clearInterval(iv); clearTimeout(wsTimer); if (ws) ws.close(); };
  paint({ total: b.total_docs, completed: b.completed_count, failed: b.failed_count, status: b.status });
  drawTabs(); await tick();
  if (!done) { connect(); iv = setInterval(tick, 2000); }
}

/* ============================== Results ============================== */
async function viewResults(id, alive) {
  const list = await api("/api/batches?limit=100"); if (!alive()) return;
  const opts = list.map(b => `<option value="${b.id}" ${b.id === id ? "selected" : ""}>${esc(batchTitle(b))} — ${fmtDate(b.created_at)}</option>`).join("");
  const picker = `<select id="pick" aria-label="Choose a job"><option value="">Choose a job…</option>${opts}</select>`;
  if (!id) {
    view.innerHTML = head("Results", "Review what the platform extracted from your files.", picker) + (list.length ? `<div class="card">${jobsTable(list)}</div>` : emptyBox("No results yet", "Process some files first.", `<a class="btn primary" href="#/new">${ic("plus")}Create New Project</a>`));
    $("#pick").onchange = e => { if (e.target.value) location.hash = "#/results/" + e.target.value; }; return;
  }
  const b = list.find(x => x.id === id) || await api("/api/batches/" + id); if (!alive()) return;
  let mode = "results", rows = null, failed = null, q = "", sortK = "filename", dir = 1, pg = 0, cols = loadCols();
  const PS = 50;
  view.innerHTML = head("Results", batchTitle(b), picker) + `<div class="card"><div class="row" style="justify-content:space-between">
    <div class="tabs" style="margin:0"><button class="tab on" data-m="results">Results</button><button class="tab" data-m="failed">Failed files (${fmtNum(b.failed_count)})</button></div>
    <div class="row" id="rtools"><button class="btn" id="dl1">${ic("download")}Download All</button><button class="btn" id="dl2">Export JSON</button></div></div>
    <div id="rbody" style="margin-top:14px">${loading()}</div></div>`;
  $("#pick").onchange = e => { if (e.target.value) location.hash = "#/results/" + e.target.value; };

  function view_() {
    let r = rows; const s = q.toLowerCase();
    if (s) r = r.filter(x => Object.values(x).some(v => v !== null && String(v).toLowerCase().includes(s)));
    r = [...r].sort((a, c) => { const x = a[sortK], y = c[sortK]; if (x == null) return 1; if (y == null) return -1; return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * dir; });
    return r;
  }
  function cell(k, v) {
    if (v === null || v === undefined) return `<td class="muted">—</td>`;
    if (k === "total") return `<td class="num">${Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>`;
    if (k === "confidence") return `<td class="num">${Math.round(v * 100)}%</td>`;
    return `<td class="${k === "filename" ? "trunc" : ""}">${esc(v)}</td>`;
  }
  function draw() {
    const body = $("#rbody"), keys = ["filename", ...cols];
    if (mode === "failed") {
      $("#rtools").hidden = true;
      if (!failed.length) { body.innerHTML = `<div class="empty">No failed files.</div>`; return; }
      body.innerHTML = `<div class="row" style="justify-content:space-between"><p class="muted" style="margin:0">${fmtNum(failed.length)} failed file${failed.length === 1 ? "" : "s"}${failed.length >= 1000 ? " (showing the first 1,000)" : ""}.</p><button class="btn sm" id="dlf">${ic("download")}Download list</button></div>
        <div class="table-wrap"><table><thead><tr><th>File</th><th>Tries</th><th>Reason</th></tr></thead><tbody>${failed.map(j => `<tr><td class="trunc">${esc(j.filename)}</td><td>${j.attempts}</td><td>${esc(j.error || "")}</td></tr>`).join("")}</tbody></table></div>
        <div class="note warn" style="margin-top:12px">Retrying failed files isn't available yet. Fix the file if needed and upload it again as a new job.</div>`;
      $("#dlf").onclick = () => download(slug(batchTitle(b)) + "-failed.csv", "﻿" + ["File,Tries,Reason"].concat(failed.map(j => [j.filename, j.attempts, j.error].map(csvCell).join(","))).join("\r\n"), "text/csv;charset=utf-8");
      return;
    }
    $("#rtools").hidden = false;
    if (!rows.length) { body.innerHTML = `<div class="empty"><h3>No results yet</h3>${b.status === "DONE" ? "No file in this job was processed successfully." : "Results appear here as files finish."} <a href="#/batch/${esc(id)}">Check progress</a></div>`; return; }
    const r = view_(), pages = Math.max(1, Math.ceil(r.length / PS)); pg = Math.min(pg, pages - 1);
    body.innerHTML = `<div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="Search results…" value="${esc(q)}" aria-label="Search results">
      <details class="cols"><summary>Choose columns</summary><div class="card" style="position:absolute;z-index:5;margin-top:6px"><div class="checks" style="grid-template-columns:1fr" id="cc">${OPTIONAL.map(([k, l]) => `<label><input type="checkbox" data-c="${k}" ${cols.includes(k) ? "checked" : ""}> ${esc(l)}</label>`).join("")}</div></div></details>
      <span class="muted">${fmtNum(r.length)} result${r.length === 1 ? "" : "s"}</span></div>
      <div class="table-wrap"><table><thead><tr>${keys.map(k => `<th class="sort" data-s="${k}" tabindex="0">${esc(colLabel(k))}${sortK === k ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
      <tbody>${r.slice(pg * PS, pg * PS + PS).map((x, i) => `<tr class="click" data-i="${pg * PS + i}">${keys.map(k => cell(k, x[k])).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="row" style="justify-content:space-between;margin-top:10px"><span class="muted">Page ${pg + 1} of ${pages}</span><span class="row"><button class="btn sm" data-p="-1" ${pg === 0 ? "disabled" : ""}>Previous</button><button class="btn sm" data-p="1" ${pg >= pages - 1 ? "disabled" : ""}>Next</button></span></div>`;
    const qi = $("#q"); qi.oninput = () => { q = qi.value; pg = 0; const pos = qi.selectionStart; draw(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
    $("#cc").onchange = e => { const k = e.target.dataset.c; if (!k) return; cols = OPTIONAL.map(c => c[0]).filter(c => c === k ? e.target.checked : cols.includes(c)); store.set("cols", cols); const op = $("details.cols"); draw(); $("details.cols").open = true; };
    body.querySelectorAll("th.sort").forEach(th => { const f = () => { if (sortK === th.dataset.s) dir = -dir; else { sortK = th.dataset.s; dir = 1; } draw(); }; th.onclick = f; th.onkeydown = e => { if (e.key === "Enter") f(); }; });
    body.querySelectorAll("[data-p]").forEach(bt => bt.onclick = () => { pg += +bt.dataset.p; draw(); });
    body.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => preview(r[+tr.dataset.i]));
  }
  function preview(x) {
    const m = modal(`<h3>${esc(x.filename)}</h3><dl class="kv">${COLS.filter(c => c[0] !== "filename").map(([k, l]) => `<dt>${esc(l)}</dt><dd>${x[k] === null || x[k] === undefined ? '<span class="muted">Not found</span>' : esc(k === "confidence" ? Math.round(x[k] * 100) + "%" : x[k])}</dd>`).join("")}</dl>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-dl>${ic("download")}Download this result</button><button class="btn primary" data-x>Close</button></div>`);
    m.el.querySelector("[data-x]").onclick = m.close;
    m.el.querySelector("[data-dl]").onclick = () => download(slug(x.filename) + ".json", JSON.stringify(x, null, 2), "application/json");
  }
  async function load() {
    try { rows = await fetchAllResults(id); } catch (e) { rows = []; toast(e.message, "bad"); } if (!alive()) return;
    draw();
  }
  document.querySelectorAll("[data-m]").forEach(t => t.onclick = async () => {
    mode = t.dataset.m; document.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("on", x === t));
    if (mode === "failed" && !failed) { $("#rbody").innerHTML = loading(); try { failed = await api(`/api/batches/${id}/jobs?status=FAILED&limit=1000`); } catch (e) { failed = []; toast(e.message, "bad"); } if (!alive()) return; }
    draw();
  });
  $("#dl1").onclick = () => downloadBatch(b, "csv"); $("#dl2").onclick = () => downloadBatch(b, "json");
  await load();
}

/* ============================== Demo & Testing ============================== */
async function viewDemo(alive) {
  const [list, health] = await Promise.all([api("/api/batches?limit=100"), api("/health").catch(() => null)]); if (!alive()) return;
  view.innerHTML = head("Demo & Testing", "Tools for demonstrations and developers. Not needed for normal use.") + `
  <div class="card"><h2>System</h2><p style="margin:0">${health ? pill("Online", "ok") + ` <span class="muted">message bus: ${esc(health.bus)}</span>` : pill("Not responding", "bad")}</p></div>
  <div class="card"><h2>Generate sample documents</h2><p class="hint">Creates synthetic invoices (about 2% deliberately corrupt, so you can see failures) and processes them like a real upload.</p>
    <div class="row"><button class="btn primary" data-n="500">${ic("play")}Run 500 sample files</button><button class="btn primary" data-n="5000">${ic("play")}Run 5,000 sample files</button>
    <input type="number" id="cn" min="1" max="20000" value="1000" aria-label="Custom number of files" style="width:110px"><button class="btn" id="cgo">Run custom</button></div></div>
  <div class="card"><h2>Extraction accuracy</h2><p class="hint">Compares extracted values with the known correct values. Only available for sample batches, and measured on documents this platform generated itself, so it is <b>not</b> a real-world accuracy figure.</p>
    <div class="row"><select id="abatch"><option value="">Choose a job…</option>${list.filter(b => /^synthetic/i.test(b.name)).map(b => `<option value="${b.id}">${esc(b.name)} — ${fmtDate(b.created_at)}</option>`).join("")}</select><button class="btn" id="ago">Show accuracy</button></div>
    <div id="aout" style="margin-top:14px"></div></div>`;
  const start = async n => {
    n = Math.floor(n); if (!(n >= 1 && n <= 20000)) return toast("Enter a number between 1 and 20,000.", "bad");
    try { const b = await api("/api/batches/synthetic", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ count: n }) }); location.hash = "#/batch/" + b.id; }
    catch (e) { toast(e.message, "bad"); }
  };
  document.querySelectorAll("[data-n]").forEach(bt => bt.onclick = () => start(+bt.dataset.n));
  $("#cgo").onclick = () => start(+$("#cn").value);
  $("#ago").onclick = async () => {
    const id = $("#abatch").value, out = $("#aout"); if (!id) return toast("Choose a job first.", "bad");
    out.innerHTML = loading();
    try {
      const a = await api(`/api/batches/${id}/accuracy`);
      out.innerHTML = `<div class="tiles"><div class="tile"><b>${(a.field_accuracy * 100).toFixed(1)}%</b><span>Fields correct</span></div><div class="tile"><b>${(a.document_exact_match * 100).toFixed(1)}%</b><span>Files fully correct</span></div><div class="tile"><b>${fmtNum(a.documents)}</b><span>Files checked</span></div></div>
      <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Field</th><th style="text-align:right">Accuracy</th></tr></thead><tbody>${Object.entries(a.per_field).map(([k, v]) => `<tr><td>${esc(colLabel(k))}</td><td class="num">${(v * 100).toFixed(1)}%</td></tr>`).join("")}</tbody></table></div>`;
    } catch (e) { out.innerHTML = `<div class="note warn">${"Accuracy isn't available for this job. It only works for sample batches that have finished."}</div>`; }
  };
}

route();
</script>
